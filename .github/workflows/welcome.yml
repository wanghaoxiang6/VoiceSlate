name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue.

            Before we dig in:
            - make sure the issue template is filled out clearly
            - check existing issues for duplicates
            - include screenshots or logs when possible
          pr-message: |
            Thanks for your first pull request.

            Before review:
            - make sure CI passes
            - include a short summary of what changed
            - attach screenshots when the UI changes
